spring.application.name=CadastroDeNinjas

# ===== Datasource (H2 em arquivo, definido no .env) =====
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===== H2 Console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
# validate: Flyway é dono do schema; Hibernate só confere se as @Entity batem
# com as tabelas. Se divergir, quebra no boot (que é o comportamento desejado).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Flyway =====
# enabled (com D): 'enable' não existe, é ignorado em silêncio.
spring.flyway.enabled=true
# Bate com o nome real da pasta em resources/db/migrations.
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true